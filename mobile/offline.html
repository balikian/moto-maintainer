<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SwingArm</title>
    <!-- Shown by the phone app when the site can't be reached (server.errorPath
         in capacitor.config.ts). Self-contained: no network, no plugins. Colors
         are the site's tokens from app/globals.css. -->
    <style>
      :root {
        --page: #ece6dc;
        --fg: #1c1f23;
        --muted: #5f5955;
        --brand: #b5281f;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141619;
          --fg: #f4ece0;
          --muted: #b5ab9c;
          --brand: #d63a2c;
          --on-brand: #fff6e6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { padding: 24px; max-width: 320px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        background: var(--brand);
        color: var(--on-brand);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach SwingArm</h1>
      <p>Check that your phone is online, then try again.</p>
      <button type="button" onclick="history.back()">Try again</button>
    </main>
  </body>
</html>
