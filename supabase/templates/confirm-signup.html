<!--
  Supabase → Authentication → Emails → Confirm signup, on both projects.
  Sent instead of the magic link the first time an email signs in.
  Subject: Welcome to SwingArm: confirm your email
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:16px 8px;font-family:Manrope,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1f23;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:20px 16px;">
        <tr>
          <td style="padding-bottom:16px;">
            <img src="https://swingarm.app/brand/swingarm-icon-512.png" width="32" height="32" alt="" style="vertical-align:middle;border-radius:7px;">
            <span style="vertical-align:middle;margin-left:8px;font-size:17px;font-weight:800;letter-spacing:1px;">SWING<span style="color:#b5281f;">ARM</span></span>
          </td>
        </tr>
        <tr>
          <td style="font-size:18px;font-weight:700;line-height:1.3;padding-bottom:8px;">Welcome to SwingArm</td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:1.5;padding-bottom:16px;">
            Confirm your email to finish signing up. Open the link on the same device and browser you signed up from.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:16px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8f1f18;color:#f2e4c9;font-size:14px;font-weight:700;text-decoration:none;padding:10px 20px;border-radius:8px;">Confirm and sign in</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:12px;line-height:1.5;color:#6b6460;">
            The link works once and expires in an hour. If you didn't sign up for SwingArm, you can ignore this email.
          </td>
        </tr>
      </table>
      <p style="font-size:12px;color:#6b6460;margin:12px 0 0;">SwingArm · <a href="https://swingarm.app" style="color:#6b6460;">swingarm.app</a></p>
    </td>
  </tr>
</table>
