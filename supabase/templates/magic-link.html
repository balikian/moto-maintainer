<!--
  Supabase → Authentication → Emails → Magic Link, on both projects.
  Subject: Your SwingArm sign-in link
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:32px 16px;font-family:Manrope,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1f23;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
        <tr>
          <td style="padding-bottom:24px;">
            <img src="https://swingarm.app/brand/swingarm-icon-512.png" width="48" height="48" alt="" style="vertical-align:middle;border-radius:10px;">
            <span style="vertical-align:middle;margin-left:10px;font-size:22px;font-weight:800;letter-spacing:1px;">SWING<span style="color:#b5281f;">ARM</span></span>
          </td>
        </tr>
        <tr>
          <td style="font-size:20px;font-weight:700;padding-bottom:12px;">Sign in to SwingArm</td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.5;padding-bottom:24px;">
            Tap the button to sign in. Open it on the same device and browser you asked from.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8f1f18;color:#f2e4c9;font-size:15px;font-weight:700;text-decoration:none;padding:12px 24px;border-radius:8px;">Sign in</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.5;color:#6b6460;">
            The link works once and expires in an hour. If you didn't ask to sign in, you can ignore this email.
          </td>
        </tr>
      </table>
      <p style="font-size:12px;color:#6b6460;margin:16px 0 0;">SwingArm · <a href="https://swingarm.app" style="color:#6b6460;">swingarm.app</a></p>
    </td>
  </tr>
</table>
